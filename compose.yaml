name: lider-automatizacion-ia

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_PATH: /data/solicitudes.db
      DATABASE_SEED_PATH: /app/material/datos_prueba.sql
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      NOTIFICATION_TO: ${NOTIFICATION_TO:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18018}:8000"
    volumes:
      - solicitudes_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.8
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_USE_WORKFLOW_PUBLICATION_SERVICE: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bogota}
      TZ: ${TZ:-America/Bogota}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5688}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./flujo:/workflows:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  solicitudes_data:
  n8n_data:

